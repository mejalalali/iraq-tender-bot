
name: Iraq Tender Bot

on:
  workflow_dispatch:
  schedule:
    # Every day at 12:00 Baghdad time (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify Chromium installation
        run: python -m playwright --version

      - name: Run tender bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

  
      - name: Save seen tenders
        if: always()
        run: |
          if [ -f seen_tenders.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add seen_tenders.json

            if ! git diff --cached --quiet; then
              git commit -m "Update seen tenders"

              git pull --rebase origin "${GITHUB_REF_NAME}"

              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
